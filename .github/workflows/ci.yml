name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # the tests run against a real PostgreSQL database, like in production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docverify
          POSTGRES_PASSWORD: docverify
          POSTGRES_DB: docverify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docverify:docverify@localhost:5432/docverify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: pytest

  docker:
    name: Docker (build + start)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
      - name: Start the whole system
        run: docker compose up -d
      - name: Check that all services work
        run: |
          echo "Waiting for the backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > health.json; then break; fi
            sleep 3
          done
          cat health.json
          grep -q '"database":"ok"' health.json
          grep -q '"vector_db":"ok"' health.json
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
